# 生产反代（阿里云 ECS）：终止 TLS、HTTP→HTTPS、HSTS，并转发真实客户端 IP/协议。
# 后端容器已设置 TRUST_PROXY=true 与 COOKIE_SECURE=true（见 .env.example）。
# 用法：把两处 <域名> 换成你的域名，把证书路径指向实际证书（阿里云免费证书或 Let's Encrypt）。
# 关键点：X-Forwarded-For 直接覆盖为 $remote_addr，避免客户端伪造 XFF 绕过限流。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 2m;

    # HTTP → HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name <域名>;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name <域名>;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 健康检查不对外暴露
        location = /health {
            return 404;
        }

        location / {
            proxy_pass http://127.0.0.1:4173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
